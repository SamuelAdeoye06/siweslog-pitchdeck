function adaptForMobile(node,isMobile){
  if(!isMobile||!React.isValidElement(node))return node;
  const style=node.props.style?{...node.props.style}:undefined;
  if(style){
    if(style.padding)style.padding='24px 18px';
    if(style.display==='grid'){style.gridTemplateColumns='1fr';style.gap=Math.min(parseInt(style.gap,10)||12,14);}
    if(typeof style.fontSize==='number'){
      if(style.fontSize>=60)style.fontSize=42;
      else if(style.fontSize>=30)style.fontSize=24;
      else if(style.fontSize>=26)style.fontSize=22;
      else if(style.fontSize>=22)style.fontSize=18;
      else if(style.fontSize<11)style.fontSize=11;
    }
    if(style.maxWidth&&typeof style.maxWidth==='number')style.maxWidth='100%';
    if(style.width==='100%'||style.maxWidth==='100%')style.boxSizing='border-box';
  }
  const children=React.Children.map(node.props.children,child=>adaptForMobile(child,isMobile));
  return React.cloneElement(node,style?{style}:undefined,children);
}

function PitchDeck(){
  const [cur,setCur]=useState(0);
  const [vw,setVw]=useState(typeof window==='undefined'?1200:window.innerWidth);
  const next=useCallback(()=>setCur(c=>Math.min(c+1,slides.length-1)),[]);

    const h=e=>{if(e.key==='ArrowRight'||e.key===' ')next();if(e.key==='ArrowLeft')prev();};
    window.addEventListener('keydown',h);
    return()=>window.removeEventListener('keydown',h);
  },[next,prev]);
  useEffect(()=>{
    const onResize=()=>setVw(window.innerWidth);
    window.addEventListener('resize',onResize);
    return()=>window.removeEventListener('resize',onResize);
  },[]);
  const S=slides[cur];
  const isMobile=vw<760;
  return React.createElement('div',{style:{fontFamily:"'Inter',system-ui,sans-serif",userSelect:'none',height:'100vh',display:'flex',flexDirection:'column',overflowY:S.scroll?'auto':'hidden',overflowX:'hidden'}},
    React.createElement('div',{style:{height:4,background:'#1E293B',flex:'0 0 auto'}},
      React.createElement('div',{style:{height:'100%',background:B,width:`${((cur+1)/slides.length)*100}%`,transition:'width 0.4s ease'}})

      React.createElement('button',{onClick:prev,disabled:cur===0,style:{padding:isMobile?'7px 10px':'7px 16px',background:cur===0?'rgba(255,255,255,0.04)':'rgba(79,142,247,0.15)',border:'1px solid rgba(79,142,247,0.3)',borderRadius:6,color:cur===0?'#334155':B,cursor:cur===0?'default':'pointer',fontSize:isMobile?12:13,fontFamily:'inherit',fontWeight:600,whiteSpace:'nowrap'}},'← Prev'),

        React.createElement('button',{onClick:next,disabled:cur===slides.length-1,style:{padding:isMobile?'7px 10px':'7px 16px',background:cur===slides.length-1?'rgba(255,255,255,0.04)':B,border:'none',borderRadius:6,color:W,cursor:cur===slides.length-1?'default':'pointer',fontSize:isMobile?12:13,fontFamily:'inherit',fontWeight:600,whiteSpace:'nowrap'}},'Next →')
      )

  );
}
