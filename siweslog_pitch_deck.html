function adaptForMobile(node, isMobile) {
  if (!isMobile || !React.isValidElement(node)) return node;

  const style = node.props.style ? { ...node.props.style } : undefined;
  if (style) {
    if (style.padding) style.padding = '24px 18px';
    if (style.display === 'grid') {
      style.gridTemplateColumns = '1fr';
      style.gap = Math.min(parseInt(style.gap, 10) || 12, 14);
    }
    if (typeof style.fontSize === 'number') {
      if (style.fontSize >= 60) style.fontSize = 42;
      else if (style.fontSize >= 30) style.fontSize = 24;
      else if (style.fontSize >= 26) style.fontSize = 22;
      else if (style.fontSize >= 22) style.fontSize = 18;
      else if (style.fontSize < 11) style.fontSize = 11;
    }
    if (style.maxWidth && typeof style.maxWidth === 'number') style.maxWidth = '100%';
    if (style.width === '100%' || style.maxWidth === '100%') style.boxSizing = 'border-box';
  }

  const children = React.Children.map(node.props.children, child => adaptForMobile(child, isMobile));
  return React.cloneElement(node, style ? { style } : undefined, children);
}
